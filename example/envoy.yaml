# Example envoy.yaml consumed by the `envoy` service in ../docker-compose.yaml.
# Replace with your actual envoy config; this is included so the example
# compose file doesn't reference a missing mount.

static_resources:
  listeners:
    - name: listener_0
      address:
        socket_address:
          address: 0.0.0.0
          port_value: 8080
      filter_chains:
        - filters:
            - name: envoy.filters.network.tcp_proxy
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.tcp_proxy.v3.TcpProxy
                stat_prefix: api
                cluster: api
  clusters:
    - name: api
      type: STRICT_DNS
      lb_policy: ROUND_ROBIN
      load_assignment:
        cluster_name: api
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address:
                      address: api
                      port_value: 3000

admin:
  address:
    socket_address:
      address: 127.0.0.1
      port_value: 9901