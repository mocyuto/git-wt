ports:
  api: 3000
env:
  COMPOSE_PROJECT_NAME: "{{.Repo}}-{{.Branch}}"
git_hooks:
  enabled: false
  path: .githooks
  # shared: true (default) - Share hooks directory from main repository root
  # shared: false          - Copy hooks directory to each new worktree
  shared: true
hooks:
  add:
    - "tmux new-window -d -n [{{.Repo}}]{{.Branch}} -c {{.Path}} 'claude; exec $SHELL'"
  rm:
    - "git pull origin main:main"

tmux:
  enabled: true
  window_name: "[{{.Repo}}]{{.Branch}}"
  panes:
    - commands:
        - "echo 'Welcome to {{.Repo}}'"
        - "ls -F"
    - id: "server"
      split: "horizontal"
      size: "30%"
      commands:
        - "npm run dev"
